spring.application.name=SmartRentalSystem

# ================= DATABASE (Railway Postgres) =================

spring.datasource.url=jdbc:${DATABASE_URL}


spring.datasource.driver-class-name=org.postgresql.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =====================================================
# 3. JWT CONFIG
# =====================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# 4. UPLOAD / CLOUDINARY
# =====================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =====================================================
# 5. AI / MODERATION
# =====================================================
sightengine.user=${SIGHTENGINE_USER}
sightengine.secret=${SIGHTENGINE_SECRET}

fpt.ai.api-key=${FPT_AI_API_KEY}

gemini.api-key=${GEMINI_API_KEY}
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# =====================================================
# 6. EMAIL (RESET PASSWORD)
# =====================================================
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================
# 7. SERVER
# =====================================================
server.port=${PORT:8080}

# =====================================================
# 8. FRONTEND URL (R\u1EA4T QUAN TR\u1ECCNG)
# =====================================================

